<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ blog.title }}</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-50 min-h-screen">
        <div class="max-w-4xl mx-auto px-4 py-10">
            <!-- Back Button -->
            <div class="mb-8">
                <a
                    href="{% url 'home_page_url' %}"
                    class="inline-flex items-center gap-2 text-indigo-600 font-medium hover:text-indigo-800 transition"
                >
                    <span>←</span>
                    Back to Blogs
                </a>
            </div>

            <!-- Blog Article -->
            <article class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <!-- Article Header -->
                <div class="px-6 sm:px-10 pt-10 pb-6">
                    <span
                        class="inline-block bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1 rounded-full mb-5"
                    >
                        BLOG ARTICLE
                    </span>

                    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 leading-tight mb-6">
                        {{ blog.title }}
                    </h1>

                    <!-- Blog Metadata -->
                    <div class="flex flex-wrap gap-4 text-sm text-gray-500 border-b border-gray-100 pb-6">
                        <span class="flex items-center gap-2"> Published: {{ blog.created_at|date:"M d, Y" }} </span>

                        <span class="flex items-center gap-2"> Updated: {{ blog.updated_at|date:"M d, Y" }} </span>
                    </div>
                </div>

                <!-- Blog Content -->
                <div class="px-6 sm:px-10 pb-10">
                    <div class="text-gray-700 text-lg leading-8 whitespace-pre-line break-words">
                        {{ blog.content }}
                    </div>
                    <a
                        href="{% url 'delete_blog_url' blog.id %}"
                        class="inline-flex items-center mt-5 gap-2 px-5 py-2.5 rounded-lg bg-red-100 text-red-600 font-semibold text-sm hover:bg-red-600 hover:text-white transition duration-300"
                    >
                        Delete
                    </a>
                    <a
                        href="{% url 'update_blog_url'   %}"
                        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-indigo-50 text-indigo-600 font-semibold text-sm hover:bg-indigo-600 hover:text-white transition duration-300"
                    >
                        Edit Blog
                    </a>
                </div>

                <!-- Article Footer -->
                <div class="bg-gray-50 border-t border-gray-200 px-6 sm:px-10 py-6">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                        <p class="text-sm text-gray-500">Thanks for reading this article!</p>

                        <a
                            href="{% url 'home_page_url' %}"
                            class="inline-flex items-center gap-2 rounded-full bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-md transition-all duration-300 hover:bg-indigo-700 hover:-translate-y-1 hover:shadow-lg"
                        >
                            ← Back to All Blogs
                        </a>
                    </div>
                </div>
            </article>

            <!-- Bottom Message -->
            <div class="text-center mt-8">
                <p class="text-sm text-gray-400">© 2026 My Blog. All rights reserved.</p>
            </div>
        </div>
    </body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Todo App{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="navbar">
        <div class="navbar-inner">
            <a href="{% url 'home' %}" class="brand">✓ TodoApp</a>
            <nav>
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}">{{ user.full_name|default:user.username }}</a>
                    <form action="{% url 'logout' %}" method="post" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-small">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-primary btn-small">Register</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
